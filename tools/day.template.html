<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--main:#1E3A5F;--accent:#E07A3F;--soft:#F4F1EA;--line:#D9D3C7;--ink:#222;--mute:#6B6B6B;--hl:rgba(240,160,90,.32);--bg:#fff;color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.65}
  .en{font-family:"Noto Serif","DejaVu Serif",Georgia,serif}
  a{color:var(--main)}
  .topbar{height:10px;background:var(--main);position:relative}
  .topbar::after{content:"";position:absolute;left:0;bottom:-3px;width:140px;height:3px;background:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 48px}
  .nav{font-size:13px;margin-bottom:10px}
  .nav a{text-decoration:none;color:var(--mute)}
  .kicker{font-size:12px;letter-spacing:.15em;color:var(--accent);font-weight:700}
  .meta{font-size:13px;color:var(--mute)}
  h1{font-size:clamp(26px,5vw,34px);line-height:1.25;color:var(--main);font-weight:700;margin:6px 0 14px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--main);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .btn:hover{border-color:var(--main)}
  .btn.primary{background:var(--main);color:#fff;border-color:var(--main)}
  .tip-hint{font-size:12.5px;color:var(--mute);margin-bottom:12px}
  .article{font-size:17.5px;line-height:1.85}
  .article p{margin-bottom:14px}
  .article p:has(+ .tr){margin-bottom:6px}
  .tr{margin:0 0 18px;font-family:"Noto Sans TC",sans-serif}
  .tr summary{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer;list-style:none;user-select:none;padding:2px 10px;border:1px solid var(--line);border-radius:999px}
  .tr summary::-webkit-details-marker{display:none}
  .tr summary::after{content:"▾";font-size:11px;transition:transform .15s}
  .tr[open] summary::after{transform:rotate(180deg)}
  .tr summary:hover{color:var(--main);border-color:var(--main)}
  .tr-body{margin-top:8px;padding:10px 14px;background:var(--soft);border-left:4px solid var(--line);font-size:15px;line-height:1.8;color:var(--ink)}
  .vw{font-weight:700;background:linear-gradient(transparent 55%,var(--hl) 55%);cursor:pointer;border-radius:2px;white-space:nowrap}
  .vw:hover,.vw.on{background:linear-gradient(transparent 0,var(--hl) 0)}
  .vw sup{font-size:10px;color:var(--accent);font-family:"Noto Sans TC",sans-serif;margin-left:1px}
  .summary{background:var(--soft);border-left:6px solid var(--main);padding:12px 16px;margin:18px 0 8px;font-size:15px}
  .summary .t{font-weight:700;color:var(--main);margin-bottom:4px}
  .src-line{font-size:12.5px;color:var(--mute);word-break:break-all;margin-top:8px}
  h2{font-size:20px;color:var(--main);font-weight:900;margin:34px 0 12px;display:flex;align-items:center;gap:8px}
  h2 .no{background:var(--main);color:#fff;font-size:13px;border-radius:4px;padding:1px 8px}
  .card{border:1px solid var(--line);border-left:6px solid var(--main);border-radius:6px;padding:12px 16px 14px;margin-bottom:12px;scroll-margin-top:16px}
  .card.flash{animation:flash 1.2s ease}
  @keyframes flash{0%{background:#FFF1E6}100%{background:#fff}}
  .word{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:6px}
  .word .n{font-size:13px;color:#fff;background:var(--accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .word .w{font-size:23px;font-weight:700;color:var(--main)}
  .word .r{font-size:14px;color:var(--mute)}
  .pos{font-size:12px;background:var(--main);color:#fff;border-radius:4px;padding:0 6px}
  .word .m{font-size:16px;font-weight:700}
  .say{border:none;background:var(--soft);color:var(--main);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .say:hover{background:#E9E3D6}
  .say.sm{width:24px;height:24px;font-size:12px;vertical-align:middle;margin-left:4px}
  .row{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:15px;line-height:1.6;margin-top:4px}
  .row .k{color:var(--accent);font-weight:700;font-size:13px;padding-top:2px}
  .row b{font-weight:700;background:linear-gradient(transparent 55%,var(--hl) 55%)}
  .src{font-size:12px;color:var(--mute);font-family:"Noto Sans TC",sans-serif}
  @media (max-width:480px){.row{grid-template-columns:1fr;gap:0}.row .k{padding-top:6px}}
  .quiz{border:1.5px solid var(--accent);border-radius:8px;padding:14px 16px;background:#FFF9F4}
  .quiz ol{padding-left:22px;font-size:16px;line-height:1.75}
  .quiz li{margin-bottom:10px}
  .quiz select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:#fff;color:var(--main);max-width:100%}
  .quiz li.ok select{border-color:#2E7D4F;background:#EAF6EE}
  .quiz li.ng select{border-color:#C0392B;background:#FCEBEA}
  .quiz .fb{font-size:13px;margin-left:6px;font-family:"Noto Sans TC",sans-serif}
  .quiz li.ok .fb{color:#2E7D4F}.quiz li.ng .fb{color:#C0392B}
  .score{font-weight:700;color:var(--main);margin-left:6px}
  .pop{position:absolute;z-index:20;max-width:min(320px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;box-shadow:0 8px 28px rgba(30,58,95,.18);padding:10px 14px 12px;font-size:14.5px;line-height:1.55;display:none}
  .pop.show{display:block}
  .pop .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pop .pw{font-size:19px;font-weight:700;color:var(--main)}
  .pop .pk{color:var(--mute);font-size:13px}
  .pop .pz{font-weight:700;margin-top:4px}
  .pop .pd{color:#444;font-style:italic;margin-top:2px}
  .pop .more{font-size:12.5px;margin-top:6px;display:inline-block}
  footer{margin-top:36px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="topbar"></div>
<main class="wrap">
  <div class="nav"><a href="../">← 所有講義</a></div>
  <div class="kicker">每日英文單字 ・ DAILY VOCAB</div>
  <div class="meta" id="meta"></div>
  <h1 class="en" id="title"></h1>
  <div class="tools">
    <button class="btn primary" id="readAll">▶ 朗讀全文</button>
    <button class="btn" id="stopAll">■ 停止</button>
  </div>
  <div class="tip-hint" id="hint">滑過（手機點一下）畫線的單字可看翻譯與解釋，按 🔊 聽發音。</div>
  <article class="article en" id="article"></article>
  <div class="summary"><div class="t">這篇在講什麼（中文摘要）</div><div id="summary"></div></div>
  <div class="src-line" id="srcline"></div>

  <h2><span class="no">01</span>今日單字</h2>
  <div id="cards"></div>

  <h2><span class="no">02</span>小測驗：填空</h2>
  <div class="quiz">
    <ol class="en" id="quiz"></ol>
    <button class="btn primary" id="check">對答案</button>
    <button class="btn" id="reveal">顯示答案</button>
    <span class="score" id="score"></span>
  </div>
  <footer>每日英文單字講義 ・ 文章為依原始新聞改寫，例句版權屬各出處。</footer>
</main>
<div class="pop" id="pop" role="dialog"></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- speech ---------- */
  const synth = window.speechSynthesis;
  let voice = null;
  function pickVoice(){
    if(!synth) return;
    const vs = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Natural/i.test(v.name))
         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
  }
  if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
  function speak(text, rate){
    if(!synth){ alert('這個瀏覽器不支援語音播放'); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if(voice) u.voice = voice; u.rate = rate || 0.9;
    synth.speak(u);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-say]');
    if(b){ e.stopPropagation(); speak(b.dataset.say, parseFloat(b.dataset.rate||'0.9')); }
  });
  if(!synth){ $('readAll').style.display='none'; $('stopAll').style.display='none'; }
  $('readAll').onclick = () => speak(D.title + '. ' + D.article.map(p => p.replace(/\{\d+\|([^}]+)\}/g,'$1')).join(' '), 0.95);
  $('stopAll').onclick = () => synth && synth.cancel();

  /* ---------- header & article ---------- */
  document.title = D.title + '｜每日英文單字 ' + D.date;
  $('meta').textContent = D.date_zh + '｜' + D.topic + '｜改寫自 ' + D.source.outlet;
  $('title').textContent = D.title;
  const zh = D.article_zh || [];
  $('article').innerHTML = D.article.map((p,k) =>
    '<p>' + esc(p).replace(/\{(\d+)\|([^}]+)\}/g, (m,i,w) =>
      `<span class="vw" tabindex="0" data-i="${i}">${w}<sup>${i}</sup></span>`) + '</p>' +
    (zh[k] ? `<details class="tr"><summary>中文翻譯</summary><div class="tr-body">${esc(zh[k])}</div></details>` : '')).join('');
  $('summary').textContent = D.summary_zh;
  $('srcline').innerHTML = '原始新聞：' + esc(D.source.outlet) + '〈' + esc(D.source.headline) + '〉' +
    esc(D.source.author) + '，' + esc(D.source.date) + '<br><a href="' + esc(D.source.url) + '" target="_blank" rel="noopener">' + esc(D.source.url) + '</a>';

  /* ---------- cards ---------- */
  function mark(sentence, word){
    const parts = word.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const re = new RegExp('\\b(' + parts[0] + '\\w*' + parts.slice(1).map(p => '\\s+' + p).join('') + ')', 'i');
    return esc(sentence).replace(re, '<b>$1</b>');
  }
  $('cards').innerHTML = D.words.map((w,k) => `
    <div class="card" id="w${k+1}">
      <div class="word"><span class="n">${k+1}</span><span class="w en">${esc(w.word)}</span>
        <button class="say" title="發音" aria-label="播放發音" data-say="${esc(w.word)}">🔊</button>
        <button class="say" title="慢速" aria-label="慢速發音" data-say="${esc(w.word)}" data-rate="0.55">🐢</button>
        <span class="r">${esc(w.kk)}</span><span class="pos">${esc(w.pos)}</span><span class="m">${esc(w.zh)}</span></div>
      <div class="row"><span class="k">英文解釋</span><span class="en">${esc(w.def)}</span></div>
      <div class="row"><span class="k">文章句</span><span class="en">${mark(w.sentence, w.word)}</span></div>
      <div class="row"><span class="k">常見搭配</span><span class="en">${w.collocations.map(esc).join(' ／ ')}</span></div>
      <div class="row"><span class="k">真實例句</span><span><span class="en">${mark(w.example, w.word)}</span><button class="say sm" aria-label="播放例句" data-say="${esc(w.example)}">🔊</button><br><span class="src">出處：${esc(w.example_src)}</span></span></div>
      <div class="row"><span class="k">近義・詞形</span><span class="en">${esc(w.related)}</span></div>
    </div>`).join('');

  /* ---------- popover ---------- */
  const pop = $('pop'); let cur = null, hideT = null;
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  function show(el){
    clearTimeout(hideT);
    const i = +el.dataset.i, w = D.words[i-1];
    pop.innerHTML = `<div class="h"><span class="pw en">${esc(w.word)}</span>
        <button class="say" aria-label="播放發音" data-say="${esc(w.word)}">🔊</button>
        <span class="pk">${esc(w.kk)}</span><span class="pos">${esc(w.pos)}</span></div>
      <div class="pz">${esc(w.zh)}</div><div class="pd en">${esc(w.def)}</div>
      <a class="more" href="#w${i}" data-go="${i}">看單字卡 ↓</a>`;
    if(cur) cur.classList.remove('on'); cur = el; el.classList.add('on');
    pop.classList.add('show');
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = r.left + window.scrollX + r.width/2 - pw/2;
    left = Math.max(window.scrollX + 12, Math.min(left, window.scrollX + document.documentElement.clientWidth - pw - 12));
    let top = r.bottom + window.scrollY + 8;
    if(r.bottom + ph + 16 > window.innerHeight && r.top > ph + 16) top = r.top + window.scrollY - ph - 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  function hide(){ pop.classList.remove('show'); if(cur){ cur.classList.remove('on'); cur = null; } }
  function hideLater(){ hideT = setTimeout(hide, 250); }
  document.querySelectorAll('.vw').forEach(el => {
    if(fine){ el.addEventListener('mouseenter', () => show(el)); el.addEventListener('mouseleave', hideLater); }
    el.addEventListener('click', e => { e.stopPropagation(); (cur === el && !fine) ? hide() : show(el); });
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); show(el); } if(e.key==='Escape') hide(); });
  });
  pop.addEventListener('mouseenter', () => clearTimeout(hideT));
  pop.addEventListener('mouseleave', () => fine && hideLater());
  pop.addEventListener('click', e => {
    e.stopPropagation();
    const s = e.target.closest('[data-say]');
    if(s){ speak(s.dataset.say, parseFloat(s.dataset.rate||'0.9')); return; }
    const g = e.target.closest('[data-go]');
    if(g){ e.preventDefault(); hide(); const c = $('w'+g.dataset.go); c.scrollIntoView({behavior:'smooth'}); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
  });
  document.addEventListener('click', hide);
  document.addEventListener('keydown', e => e.key==='Escape' && hide());
  window.addEventListener('resize', hide);

  /* ---------- quiz ---------- */
  const bank = D.words.map((w,k) => ({w:w.word, i:k+1}));
  const shuffled = bank.slice().sort((a,b) => ((a.i*7+3)%11) - ((b.i*7+3)%11));
  const opts = '<option value="">— 選 —</option>' + shuffled.map(o => `<option value="${o.i}">${esc(o.w)}</option>`).join('');
  $('quiz').innerHTML = D.quiz.map((q,k) =>
    `<li data-a="${q.a}" data-form="${esc(q.form || D.words[q.a-1].word)}">` +
    esc(q.q).replace('___', `<select aria-label="第 ${k+1} 題">${opts}</select>`) + '<span class="fb"></span></li>').join('');
  function check(reveal){
    let ok = 0;
    $('quiz').querySelectorAll('li').forEach(li => {
      const s = li.querySelector('select'), fb = li.querySelector('.fb');
      if(reveal) s.value = li.dataset.a;
      const right = s.value === li.dataset.a;
      if(!s.value){ li.classList.remove('ok','ng'); fb.textContent = '（未作答）'; return; }
      li.classList.toggle('ok', right); li.classList.toggle('ng', !right);
      if(right) ok++;
      fb.textContent = right ? ('✓ ' + (li.dataset.form !== D.words[li.dataset.a-1].word ? '（' + li.dataset.form + '）' : ''))
                             : '✗ 答案：' + li.dataset.form;
    });
    $('score').textContent = reveal ? '' : ok + ' / ' + D.quiz.length;
  }
  $('check').onclick = () => check(false);
  $('reveal').onclick = () => check(true);
})();
</script>
</body>
</html>
